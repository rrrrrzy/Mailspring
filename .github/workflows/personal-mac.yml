name: Personal macOS build

on:
  push:
    branches: [macos/background-dock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Build patched Mailspring-Sync
        run: |
          git -C mailsync apply --check ../scripts/mailsync-unread-retry.patch
          git -C mailsync apply ../scripts/mailsync-unread-retry.patch
          SIGN_BUILD=false ./mailsync/build.sh
          lipo app/mailsync -verify_arch arm64
          shasum -a 256 app/mailsync | cut -d ' ' -f 1 > "$RUNNER_TEMP/mailsync.sha256"
      - name: Test IMAP read-state retries
        run: |
          python3 -m venv "$RUNNER_TEMP/mailsync-tests"
          "$RUNNER_TEMP/mailsync-tests/bin/pip" install -r mailsync/test/requirements.txt
          cd mailsync
          "$RUNNER_TEMP/mailsync-tests/bin/python" test/run.py test/scenarios/unread-write-retry.yaml --server fake:netease-coremail --mailsync "$GITHUB_WORKSPACE/app/mailsync"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify and archive the Apple silicon app
        working-directory: app/dist/Mailspring-darwin-arm64
        run: |
          set -euo pipefail
          test -x Mailspring.app/Contents/MacOS/Mailspring
          test -s Mailspring.app/Contents/Resources/app.asar
          test -x Mailspring.app/Contents/Resources/app.asar.unpacked/mailsync
          lipo Mailspring.app/Contents/MacOS/Mailspring -verify_arch arm64
          test "$(shasum -a 256 Mailspring.app/Contents/Resources/app.asar.unpacked/mailsync | cut -d ' ' -f 1)" = "$(cat "$RUNNER_TEMP/mailsync.sha256")"
          codesign --force --deep --sign - Mailspring.app
          codesign --verify --deep --strict Mailspring.app
          ditto -c -k --keepParent Mailspring.app ../Mailspring-AppleSilicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mailspring-AppleSilicon
          path: app/dist/Mailspring-AppleSilicon.zip
          if-no-files-found: error
          compression-level: 0
